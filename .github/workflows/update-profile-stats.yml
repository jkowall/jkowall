name: Update profile stats

# Regenerates the SVG cards in assets/ from the GitHub API. The README links
# these files directly so star counts and stats do not depend on shields.io,
# Vercel, or Heroku being up when someone opens the profile.
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render stat images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_assets.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Stats unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile stat images"
          git push
